name: ci

# Pre-merge gate for the test-branch -> PR -> main pipeline. Runs the fast code
# checks (gofmt / go vet / go test, GUI cgo packages excluded, mirroring the
# release gate) plus a lightweight README<->go.mod Wails-version sync check, on
# every PR into main and every push to the test branch.
#
# The full release gate (Wails 3-way version sync + per-OS GUI builds + the
# 6-archive completeness check) still runs in release.yml at tag push. Runtime
# artifact bugs (signing, port binding, packaging) are validated by downloading
# the pre-release build, which is the whole point of the test channel — so they
# are intentionally NOT rebuilt here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  checks:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Wails version is in sync (README / go.mod)
        shell: bash
        run: |
          set -euo pipefail
          readme=$(grep -oE 'wails/v2/cmd/wails@v[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | sed 's/.*@//')
          gomod=$(grep -oE 'wailsapp/wails/v2 v[0-9]+\.[0-9]+\.[0-9]+' go.mod | head -1 | sed 's/.* v/v/')
          echo "README=${readme}  go.mod=${gomod}"
          if [ "${readme}" != "${gomod}" ]; then
            echo "::error::Wails version mismatch — sync README (wails@…) and go.mod."
            exit 1
          fi
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet (excluding GUI cgo packages)
        shell: bash
        run: go vet $(go list ./... | grep -vE '/(cmd/psdns-gui|internal/gui)$')
      # Type-check sources AND tests for the other release OSes without running
      # them. Catches unix-only symbols in test files (e.g. syscall.Kill) here on
      # the test branch, instead of at tag time in release.yml's Windows job.
      - name: go vet cross-OS (windows/darwin, excluding GUI cgo packages)
        shell: bash
        run: |
          pkgs=$(go list ./... | grep -vE '/(cmd/psdns-gui|internal/gui)$')
          for goos in windows darwin; do
            echo "== GOOS=${goos}"
            GOOS="${goos}" go vet $pkgs
          done
      - name: golangci-lint (excluding GUI cgo packages)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: ./cmd/psdns ./internal/config ./internal/dnssrv ./internal/doh ./internal/frag ./internal/proxy ./internal/relaunch ./internal/resolver ./internal/selfupdate ./internal/supervisor ./internal/sysproxy ./internal/uiconfig
      - name: go test -race + coverage (excluding GUI cgo packages)
        shell: bash
        run: |
          pkgs=$(go list ./... | grep -vE '/(cmd/psdns-gui|internal/gui)$')
          go test -race -covermode=atomic -coverprofile=coverage.out $pkgs
          go tool cover -func=coverage.out | tail -1
      - name: Coverage threshold gate
        shell: bash
        run: |
          set -euo pipefail
          # Current coverage is ~92% on macOS and ~89-90% here on Linux — the gap
          # is the OS-specific sysproxy file (sysproxy_linux.go / _windows.go) that
          # is compiled but not yet exercised (only the pure parsers in format.go
          # are). The 86% floor sits safely below the lowest matrix OS (~88% on the
          # Windows release runner) so it catches a real regression without a false
          # failure from that per-OS gap. Raise toward 90% once the Windows/Linux
          # sysproxy paths get OS-gated tests.
          min=86.0
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$NF); print $NF}')
          echo "total coverage=${total}%  floor=${min}%"
          if awk "BEGIN{exit !(${total} < ${min})}"; then
            echo "::error::coverage ${total}% is below the ${min}% floor"
            exit 1
          fi

  # The GUI cgo packages are excluded from the checks job above (they need a
  # native toolchain), so vet/test them here on macOS and Windows — where the
  # tray (systray) and webview (Wails) native deps ship with the OS, needing no
  # apt install. Linux GUI needs libgtk/libwebkit2gtk/libayatana-appindicator3
  # and is validated at release time by release.yml's build-gui job instead.
  gui:
    name: gui vet + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet (GUI cgo packages)
        shell: bash
        run: go vet ./internal/gui/... ./cmd/psdns-gui/...
      - name: go test -race (GUI cgo packages)
        shell: bash
        run: go test -race ./internal/gui/... ./cmd/psdns-gui/...
